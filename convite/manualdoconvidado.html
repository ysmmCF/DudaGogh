<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d22">
  <title>Manual do Convidado | Eduarda 15 Anos</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #080d22;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #080d22;
    }

    .background-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    
.back-button {
  position: fixed;
  z-index: 1000;
  top: max(16px, env(safe-area-inset-top));
  left: max(16px, env(safe-area-inset-left));
  bottom: auto;
  transform: none;

  width: 44px;
  height: 44px;
  padding: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid rgba(243, 229, 171, 0.8);
  border-radius: 50%;
  background: rgba(8, 13, 34, 0.92);
  color: #f3e5ab;

  font-family: Arial, sans-serif;
  font-size: 29px;
  font-weight: 300;
  line-height: 1;
  text-decoration: none;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(8px);
  -webkit-tap-highlight-color: transparent;
}

.back-button:active {
  background: rgba(22, 34, 77, 0.98);
  transform: scale(0.94);
}

       
  </style>
</head>

<body>
  <main class="page">
    <img
      class="background-image"
      src="https://ysmmcf.github.io/DudaGogh/manualdoconvidado.jpg"
      alt="Manual do convidado da festa de 15 anos da Eduarda"
    >

    <a
  class="back-button"
  href="index.html"
  data-back-to-invitation
  aria-label="Fechar e voltar ao convite"
  title="Voltar ao convite"
>
  ×
    </a>
  </main>
</body>
</html>
